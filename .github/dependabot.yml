# Weekly dependency updates, grouped so they arrive as one reviewable PR per
# ecosystem. CI (check, build, check:dist, e2e, prod audit) gates each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      # Majors get their own PR so they never block the routine group and
      # never pile up unseen. Split it by package if one major fails CI.
      major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
